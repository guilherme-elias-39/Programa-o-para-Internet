{% extends 'base.html' %}

{% block title %}{{ titulo }} | Portal de Notícias{% endblock %}

{% block content %}

<section class="pagina">

    <div class="titulo-pagina">
        <span>CLASSIFICAÇÃO</span>
        <h1>{{ titulo }}</h1>
        <p>Preencha os dados da etiqueta abaixo.</p>
    </div>

    <div class="formulario-card">

        <form method="post" class="formulario">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="formulario-acoes">
                <button type="submit" class="botao-principal">
                    Salvar
                </button>

                <a href="{% url 'lista_tags' %}" class="botao-cancelar">
                    Cancelar
                </a>
            </div>
        </form>

    </div>

</section>

{% endblock %}
