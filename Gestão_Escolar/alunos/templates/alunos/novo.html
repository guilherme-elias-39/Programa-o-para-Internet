{% extends "base.html" %}
{% load static %}

{% block content %}

<section class="container">
    <h2>Novo Aluno</h2>

    <form class="form">
        <label>Nome:</label>
        <input type="text" placeholder="Digite o nome">

        <label>Matrícula:</label>
        <input type="text" placeholder="Digite a matrícula">

        <label>Curso:</label>
        <input type="text" placeholder="Digite o curso">

        <button type="submit" class="btn">Salvar</button>

    </form>
    <a href="{% url 'alunos:lista' %}" class="btn">Voltar</a>
</section>

{% endblock content %}
